name: Tests

# Runs the automated test suite as a merge gate. Triggers on every pull request
# (submission and each update) and on merges to main. Uses the `pull_request`
# event -- never `pull_request_target` -- so fork PRs run with no secrets and a
# read-only token. See docs/admin/ci-required-check.md for making it a required
# status check.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Least-privilege: a test-only gate needs no write scope.
permissions:
  contents: read

# Cancel superseded runs on the same pull request; never cancel a push to main.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job name `test-suite` is the required-status-check identifier -- do not
  # rename it without updating branch protection on both repos.
  test-suite:
    name: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          docker-images: false
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          file: ./app/Dockerfile
          tags: astrodash:latest
          load: true
          platforms: linux/amd64
          # Scope the cache away from the image-publish workflow's default
          # type=gha cache so a PR build cannot poison layers a release consumes.
          cache-from: type=gha,scope=ci-test
          cache-to: type=gha,mode=max,scope=ci-test

      - name: Run test suite
        run: |
          docker compose --profile ci \
            -f docker/docker-compose.ci.yaml \
            -f docker/docker-compose.ci.github.yaml \
            --env-file env/.env.default \
            --env-file env/.env.ci \
            up --abort-on-container-exit --exit-code-from app
